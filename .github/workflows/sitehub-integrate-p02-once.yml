name: SiteHub integrate p02 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sitehub-integrate-p02-once.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deployed initial HTML
        shell: python
        env: {SITEHUB_PROJECT: p02, PUBLIC_URL: 'https://gyeol.suaveforge.com/', DESCRIPTION: '결(GYEOL) — 매일 새로운 프로필을 추천받고, 매칭되면 바로 대화하는 소개팅 매칭 서비스.'}
        run: |
          from pathlib import Path
          import os,re,html
          p=Path('index.html');s=p.read_text(encoding='utf-8');pid=os.environ['SITEHUB_PROJECT'];m=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S);title=html.unescape(re.sub(r'<[^>]+>','',m.group(1)).strip()) if m else pid;e=lambda x:html.escape(x,quote=True);u=os.environ['PUBLIC_URL'];d=os.environ['DESCRIPTION'];img='https://sitehub.suaveforge.com/assets/namecard-default.png'
          if f'data-sitehub-project="{pid}"' not in s:
            b=f'''\n  <!-- SITEHUB-BEGIN -->\n  <link rel="canonical" href="{e(u)}">\n  <meta property="og:title" content="{e(title)}">\n  <meta property="og:description" content="{e(d)}">\n  <meta property="og:image" content="{img}">\n  <meta property="og:url" content="{e(u)}">\n  <meta property="og:site_name" content="SuaveForge">\n  <meta name="twitter:card" content="summary_large_image">\n  <script async src="https://sitehub.suaveforge.com/analytics-loader.js" data-sitehub-project="{pid}"></script>\n  <!-- SITEHUB-END -->\n''';s,n=re.subn(r'</head\s*>',b+'</head>',s,count=1,flags=re.I);assert n==1;p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        run: |
          set -Eeuo pipefail
          grep -q 'data-sitehub-project="p02"' index.html
          grep -q 'property="og:image"' index.html
          git config user.name 'SuaveForge SiteHub'
          git config user.email '53187583+programmer119@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate SiteHub p02'
          git push
